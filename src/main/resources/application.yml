server:
  port: 4001

spring:
  application:
    name: s3-asset-monitor

  banner:
    location: classpath:banner.txt

# S3 connection (any S3-compatible store: MinIO, RustFS, AWS S3, ...)
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}

# Bucket monitor configuration
monitor:
  # Comma-separated or YAML list of bucket names to watch
  buckets: ${MONITOR_BUCKETS:datalake}
  # How often to poll each bucket (seconds)
  poll-interval-seconds: ${MONITOR_POLL_INTERVAL_SECONDS:30}
  # File extensions to watch (lowercase, including the dot)
  file-extensions:
    - .csv
  # Per-dataset metadata file, registered in Piveau as the dataset (needs piveau.url)
  metadata-file-name: ${MONITOR_METADATA_FILE_NAME:metadata.json}

# DALI EDC Connector
dali:
  connector:
    # Management API base URL, used to register each file as an EDC asset
    url: ${DALI_CONNECTOR_URL:}
    # Public connector URL written as dcat:accessURL on Piveau distributions (defaults to url)
    access-url: ${DALI_CONNECTOR_ACCESS_URL:}

# Piveau Hub Repo (catalogue). Leave PIVEAU_URL empty to disable catalogue registration.
# Auth: OAuth2 client-credentials when all three PIVEAU_KEYCLOAK_* are set, else PIVEAU_API_KEY.
piveau:
  url: ${PIVEAU_URL:}
  api-key: ${PIVEAU_API_KEY:}
  keycloak-token-url: ${PIVEAU_KEYCLOAK_TOKEN_URL:}
  keycloak-client-id: ${PIVEAU_KEYCLOAK_CLIENT_ID:}
  keycloak-client-secret: ${PIVEAU_KEYCLOAK_CLIENT_SECRET:}
  # Polls a file is retried for (e.g. a CSV waiting for its dataset's metadata.json)
  max-attempts: ${PIVEAU_MAX_ATTEMPTS:20}

# Spring Boot Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    net.sparkworks.datalake.monitor: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    root: WARN
    net.sparkworks.datalake.monitor: INFO